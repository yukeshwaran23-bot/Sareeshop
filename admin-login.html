<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Varnam Silks</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8f2ed;
            font-family: Arial, sans-serif;
            color: #321039;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow:
                0 8px 30px
                rgba(50, 16, 57, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #321039;
        }

        .brand p {
            margin-top: 7px;
            font-size: 9px;
            letter-spacing: 2px;
            color: #d7a849;
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-title h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .login-title p {
            font-size: 12px;
            color: #777;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #fffaf5;
            color: #321039;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #d7a849;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 5px;
            border: none;
            border-radius: 7px;
            background: #321039;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #fde8e8;
            color: #b52b2b;
            font-size: 12px;
            text-align: center;
        }

        .back-home {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="login-card">


        <div class="brand">

            <h1>
                VARNAM SILKS
            </h1>

            <p>
                SAREES THAT SPEAK ELEGANCE
            </p>

        </div>


        <div class="login-title">

            <h2>
                Admin Login
            </h2>

            <p>
                Sign in to manage your store
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div
            class="error"
            id="errorMessage"
        >
            Invalid username or password.
        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Store
        </a>


    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const errorMessage =
                        document
                            .getElementById("errorMessage");


                    errorMessage.style.display =
                        "none";


                    try {

                        const response =
                            await fetch(
                                "http://localhost:5000/api/admin/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username:
                                                username,

                                            password:
                                                password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Login failed"
                            );

                        }


                        localStorage.setItem(
                            "varnamAdminToken",
                            data.token
                        );


                        window.location.href =
                            "admin.html";


                    } catch (error) {

                        console.error(
                            "Admin login failed:",
                            error
                        );


                        errorMessage.textContent =
                            "Unable to login. Backend may not be connected.";


                        errorMessage.style.display =
                            "block";

                    }

                }
            );

    </script>


</body>

</html>
