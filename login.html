<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Varnam Silks</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #321039;
            color: #ffffff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .login-container {
            width: 100%;
            max-width: 390px;

            background: #fffbf7;

            border-radius: 18px;

            padding: 30px 24px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);
        }


        .logo {
            text-align: center;

            color: #321039;

            font-size: 28px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }


        .tagline {
            text-align: center;

            color: #777;

            font-size: 11px;

            letter-spacing: 1.5px;

            margin-bottom: 30px;
        }


        .title {
            color: #321039;

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .subtitle {
            color: #777;

            font-size: 13px;

            margin-bottom: 24px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            color: #321039;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .form-group input {
            width: 100%;

            height: 48px;

            border: 1px solid #ddd;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 15px;

            outline: none;

            background: #ffffff;
        }


        .form-group input:focus {
            border-color: #d7a849;

            box-shadow:
                0 0 0 2px rgba(215, 168, 73, 0.15);
        }


        .login-btn {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background: #d7a849;

            color: #321039;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        .login-btn:active {
            transform: scale(0.98);
        }


        .login-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        .message {
            display: none;

            margin-top: 16px;

            padding: 11px;

            border-radius: 8px;

            font-size: 13px;

            text-align: center;
        }


        .message.error {
            display: block;

            background: #ffe7e7;

            color: #a00000;
        }


        .register-text {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-top: 24px;
        }


        .register-link {
            color: #5b176d;

            font-weight: bold;

            text-decoration: none;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #777;

            font-size: 12px;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            VARNAM SILKS
        </div>


        <div class="tagline">
            SAREES THAT SPEAK ELEGANCE
        </div>


        <div class="title">
            Welcome Back
        </div>


        <div class="subtitle">
            Login to your Varnam Silks account
        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    maxlength="15"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <div class="register-text">

            Don't have an account?

            <a
                href="register.html"
                class="register-link"
            >
                Create Account
            </a>

        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Varnam Silks
        </a>


    </div>


    <script>


        const API_URL =
    "https://varnam-silks-backend-4.onrender.com";


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        const message =
            document.getElementById(
                "message"
            );


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                message.className =
                    "message";


                message.textContent =
                    "";


                loginBtn.disabled =
                    true;


                loginBtn.textContent =
                    "LOGGING IN...";


                try {


                    const response =
                        await fetch(
                            API_URL +
                            "/api/customer/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        phone:
                                            phone,

                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Login failed"
                        );

                    }


                    /* --------------------------------
                       SAVE CUSTOMER LOGIN
                    -------------------------------- */

                    localStorage.setItem(
                        "varnamCustomerToken",
                        data.token
                    );


                    localStorage.setItem(
                        "varnamCustomer",
                        JSON.stringify(
                            data.user
                        )
                    );


                    /* --------------------------------
                       LOGIN SUCCESS
                    -------------------------------- */

                    window.location.href =
                        "index.html";


                } catch (error) {


                    console.error(
                        "Customer login error:",
                        error
                    );


                    message.className =
                        "message error";


                    message.textContent =
                        error.message ||
                        "Unable to login. Please try again.";


                } finally {


                    loginBtn.disabled =
                        false;


                    loginBtn.textContent =
                        "LOGIN";

                }

            }
        );


    </script>


</body>

</html>
