<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    My Orders | VARNAM SILKS
</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    background: #f8f2ed;

    color: #321039;

}


/* ==========================================
   TOPBAR
   ========================================== */

.topbar {

    height: 64px;

    background: #321039;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.back-btn {

    width: 35px;

    height: 35px;

    border: none;

    background: transparent;

    color: white;

    font-size: 27px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

}


.back-btn:active {

    transform: scale(.92);

}


.brand {

    text-align: center;

}


.brand h1 {

    font-size: 18px;

    letter-spacing: 2px;

}


.brand p {

    font-size: 8px;

    color: #d7a849;

    letter-spacing: 1.5px;

    margin-top: 3px;

}


.top-space {

    width: 35px;

}


/* ==========================================
   PAGE
   ========================================== */

.page {

    width: 100%;

    max-width: 650px;

    margin: auto;

    padding: 22px 15px 40px;

}


.page-title {

    text-align: center;

    margin-bottom: 22px;

}


.page-title h2 {

    font-size: 24px;

    color: #321039;

}


.page-title p {

    font-size: 13px;

    color: #777;

    margin-top: 6px;

}


/* ==========================================
   LOADING
   ========================================== */

.loading {

    background: white;

    border-radius: 15px;

    padding: 40px 20px;

    text-align: center;

    box-shadow:
        0 3px 12px
        rgba(50,16,57,.08);

}


.loading-text {

    color: #777;

    font-size: 13px;

}


.spinner {

    width: 30px;

    height: 30px;

    border: 3px solid #eee;

    border-top-color: #321039;

    border-radius: 50%;

    margin: 0 auto 15px;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {

        transform: rotate(360deg);

    }

}


/* ==========================================
   ORDER CARD
   ========================================== */

.order-card {

    background: white;

    border-radius: 15px;

    padding: 17px;

    margin-bottom: 15px;

    box-shadow:
        0 3px 12px
        rgba(50,16,57,.08);

}


.order-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 10px;

    padding-bottom: 14px;

    border-bottom: 1px solid #eee;

}


.order-id {

    font-size: 14px;

    font-weight: bold;

    color: #321039;

}


.order-date {

    font-size: 11px;

    color: #888;

    margin-top: 5px;

}


/* ==========================================
   STATUS
   ========================================== */

.status {

    padding: 6px 10px;

    border-radius: 20px;

    background: #fff4d8;

    color: #8a6414;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

}


.status.delivered {

    background: #e6f6eb;

    color: #267344;

}


.status.cancelled {

    background: #fde8e8;

    color: #b52b2b;

}


.status.confirmed {

    background: #e8eefc;

    color: #3159a6;

}


.status.packed {

    background: #eee8f7;

    color: #653b8d;

}


.status.shipped {

    background: #e4f5f6;

    color: #26777c;

}


/* ==========================================
   ORDER INFO
   ========================================== */

.order-info {

    display: flex;

    justify-content: space-between;

    padding: 13px 0;

}


.info-item {

    display: flex;

    flex-direction: column;

    gap: 5px;

}


.info-label {

    font-size: 11px;

    color: #888;

}


.info-value {

    font-size: 14px;

    font-weight: bold;

    color: #321039;

}


/* ==========================================
   ITEM PREVIEW
   ========================================== */

.item-preview {

    display: flex;

    gap: 9px;

    margin-top: 2px;

    overflow-x: auto;

    scrollbar-width: none;

}


.item-preview::-webkit-scrollbar {

    display: none;

}


.item-image {

    width: 52px;

    height: 62px;

    object-fit: cover;

    border-radius: 7px;

    background: #f1e8e2;

    flex-shrink: 0;

}


.more-items {

    width: 52px;

    height: 62px;

    border-radius: 7px;

    background: #f1e8e2;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #321039;

    font-size: 12px;

    font-weight: bold;

    flex-shrink: 0;

}


/* ==========================================
   FOOTER
   ========================================== */

.order-footer {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-top: 15px;

    padding-top: 14px;

    border-top: 1px solid #eee;

}


.total-label {

    font-size: 12px;

    color: #777;

}


.total-price {

    font-size: 18px;

    font-weight: bold;

    color: #321039;

    margin-top: 3px;

}


/* ==========================================
   VIEW BUTTON
   ========================================== */

.view-btn {

    border: 1px solid #321039;

    background: white;

    color: #321039;

    padding: 10px 15px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

}


.view-btn:hover {

    background: #321039;

    color: white;

}


.view-btn:active {

    transform: scale(.97);

}


/* ==========================================
   EMPTY
   ========================================== */

.empty {

    background: white;

    border-radius: 15px;

    padding: 45px 20px;

    text-align: center;

    box-shadow:
        0 3px 12px
        rgba(50,16,57,.08);

}


.empty-icon {

    font-size: 42px;

    margin-bottom: 12px;

}


.empty h3 {

    color: #321039;

    font-size: 19px;

}


.empty p {

    color: #777;

    font-size: 13px;

    margin-top: 7px;

}


.shop-btn {

    margin-top: 20px;

    width: 100%;

    max-width: 250px;

    height: 45px;

    border: none;

    border-radius: 9px;

    background: #321039;

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}


/* ==========================================
   ERROR
   ========================================== */

.error-box {

    background: white;

    border-radius: 15px;

    padding: 40px 20px;

    text-align: center;

    box-shadow:
        0 3px 12px
        rgba(50,16,57,.08);

}


.error-icon {

    font-size: 38px;

    margin-bottom: 12px;

}


.error-box h3 {

    color: #321039;

    font-size: 18px;

}


.error-box p {

    color: #777;

    font-size: 13px;

    margin-top: 8px;

    line-height: 1.5;

}


.retry-btn {

    margin-top: 18px;

    height: 43px;

    padding: 0 25px;

    border: none;

    border-radius: 8px;

    background: #321039;

    color: white;

    font-size: 13px;

    font-weight: bold;

}


/* ==========================================
   DESKTOP
   ========================================== */

@media (min-width: 700px) {

    .page {

        padding-top: 30px;

    }


    .topbar {

        padding: 0 30px;

    }

}


  .logout-btn {
    display: block;
    margin: 18px auto 0;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: #D7A849;
    color: #321039;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.logout-btn:active {
    transform: scale(.97);
}

.logout-btn:active {
    transform: scale(.97);
}

</style>

</head>


<body>


<header class="topbar">


<button
    class="back-btn"
    id="backButton"
    type="button"
>
    ←
</button>


<div class="brand">

    <h1>
        VARNAM SILKS
    </h1>

    <p>
        SAREES THAT SPEAK ELEGANCE
    </p>

</div>


<div class="top-space"></div>


</header>


<main class="page">


<div class="page-title">

    <h2>
        My Orders
    </h2>

    <p>
        Track and view your Varnam Silks orders
    </p>

    <button
        class="logout-btn"
        id="logoutButton"
        type="button"
    >
        Logout
    </button>

</div>


<div id="ordersContainer">


<!-- Orders will load here -->


</div>


</main>


<script>


/* ==========================================
   VARNAM SILKS
   MY ORDERS
   ========================================== */


/* ==========================================
   API
   ========================================== */

const API_URL =
    "https://varnam-silks-backend-4.onrender.com";


const TOKEN_KEY =
    "varnamCustomerToken";


const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


/* ==========================================
   FORMAT PRICE
   ========================================== */

function formatPrice(price) {

    return "₹" +
        Number(price || 0)
            .toLocaleString("en-IN");

}


/* ==========================================
   FORMAT DATE
   ========================================== */

function formatDate(dateString) {

    if (!dateString) {

        return "-";

    }


    const date =
        new Date(dateString);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* ==========================================
   STATUS CLASS
   ========================================== */

function getStatusClass(status) {

    if (!status) {

        return "";

    }


    const value =
        String(status)
            .toLowerCase();


    if (
        value.includes("delivered")
    ) {

        return "delivered";

    }


    if (
        value.includes("cancel") ||
        value.includes("rejected")
    ) {

        return "cancelled";

    }


    if (
        value.includes("confirmed")
    ) {

        return "confirmed";

    }


    if (
        value.includes("packed")
    ) {

        return "packed";

    }


    if (
        value.includes("shipped")
    ) {

        return "shipped";

    }


    return "";

}


/* ==========================================
   LOADING
   ========================================== */

function showLoading() {

    ordersContainer.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <div class="loading-text">
                Loading your orders...
            </div>

        </div>

    `;

}


/* ==========================================
   EMPTY
   ========================================== */

function showEmptyOrders() {

    ordersContainer.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🛍️
            </div>

            <h3>
                No Orders Yet
            </h3>

            <p>
                Your purchased sarees
                will appear here.
            </p>

            <button
                class="shop-btn"
                type="button"
                id="shopButton"
            >
                Start Shopping
            </button>

        </div>

    `;


    document
        .getElementById("shopButton")
        .addEventListener(
            "click",
            function() {

                window.location.href =
                    "index.html";

            }
        );

}


/* ==========================================
   ERROR
   ========================================== */

function showError(message) {

    ordersContainer.innerHTML = `

        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <h3>
                Unable to Load Orders
            </h3>

            <p>
                ${message}
            </p>

            <button
                class="retry-btn"
                type="button"
                id="retryButton"
            >
                Try Again
            </button>

        </div>

    `;


    document
        .getElementById("retryButton")
        .addEventListener(
            "click",
            loadOrders
        );

}
  /* ==========================================
   GET CUSTOMER TOKEN
   ========================================== */

function getCustomerToken() {

    return localStorage.getItem(
        TOKEN_KEY
    );

}


/* ==========================================
   NORMALIZE ORDERS RESPONSE
   ========================================== */

function getOrdersArray(data) {

    if (
        Array.isArray(data)
    ) {

        return data;

    }


    if (
        data &&
        Array.isArray(data.orders)
    ) {

        return data.orders;

    }


    if (
        data &&
        Array.isArray(data.data)
    ) {

        return data.data;

    }


    return [];

}


/* ==========================================
   LOAD ORDERS
   ========================================== */

async function loadOrders() {

    showLoading();


    const token =
        getCustomerToken();


    /* ======================================
       LOGIN CHECK
       ====================================== */

    if (!token) {

        window.location.href =
            "login.html";

        return;

    }


    try {


        /* ==================================
           GET CURRENT CUSTOMER ORDERS
           ================================== */

        const response =
            await fetch(
                API_URL +
                "/api/orders/my-orders",
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        /* ==================================
           AUTH ERROR
           ================================== */

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            localStorage.removeItem(
                "varnamCustomer"
            );


            window.location.href =
                "login.html";

            return;

        }


        /* ==================================
           SERVER ERROR
           ================================== */

        if (
            !response.ok
        ) {

            let errorMessage =
                "Unable to load your orders.";

            try {

                const errorData =
                    await response.json();


                if (
                    errorData &&
                    errorData.message
                ) {

                    errorMessage =
                        errorData.message;

                }

            } catch (error) {

                /* Ignore JSON error */

            }


            throw new Error(
                errorMessage
            );

        }


        /* ==================================
           READ RESPONSE
           ================================== */

        const data =
            await response.json();


        console.log(
            "My Orders API response:",
            data
        );


        /* ==================================
           GET ARRAY
           ================================== */

        const orders =
            getOrdersArray(data);


        /* ==================================
           NO ORDERS
           ================================== */

        if (
            orders.length === 0
        ) {

            showEmptyOrders();

            return;

        }


        /* ==================================
           RENDER
           ================================== */

        renderOrders(
            orders
        );


    } catch (error) {

        console.error(
            "My Orders error:",
            error
        );


        showError(
            error.message ||
            "Please check your internet connection and try again."
        );

    }

}


/* ==========================================
   RENDER ORDERS
   ========================================== */

function renderOrders(
    orders
) {

    let ordersHTML =
        "";


    orders.forEach(
        function(order) {


            /* ==============================
               ITEMS
               ============================== */

            const items =
                Array.isArray(
                    order.items
                )
                    ? order.items
                    : [];


            /* ==============================
               ITEM PREVIEW
               ============================== */

            let previewHTML =
                "";


            const previewItems =
                items.slice(
                    0,
                    4
                );


            previewItems.forEach(
                function(item) {


                    const image =
                        item.image ||
                        "";


                    const name =
                        item.name ||
                        "Product";


                    if (image) {

                        previewHTML += `

                            <img
                                class="item-image"
                                src="${image}"
                                alt="${name}"
                                onerror="
                                    this.style.display='none';
                                "
                            >

                        `;

                    }

                }
            );


            /* ==============================
               MORE ITEMS
               ============================== */

            if (
                items.length > 4
            ) {

                previewHTML += `

                    <div class="more-items">

                        +${items.length - 4}

                    </div>

                `;

            }


            /* ==============================
               IF NO IMAGE
               ============================== */

            if (
                previewHTML === ""
            ) {

                previewHTML = `

                    <div
                        class="more-items"
                        style="
                            width:52px;
                            color:#777;
                        "
                    >
                        ${items.length}
                    </div>

                `;

            }


            /* ==============================
               ORDER ID
               ============================== */

            const orderId =
                order.orderId ||
                order._id ||
                "Order";


            /* ==============================
               STATUS
               ============================== */

            const status =
                order.status ||
                "Order Placed";


            /* ==============================
               PAYMENT
               ============================== */

            const payment =
                order.paymentMethod ||
                "Cash on Delivery";


            /* ==============================
               TOTAL
               ============================== */

            const total =
                formatPrice(
                    order.total
                );


            /* ==============================
               DATE
               ============================== */

            const date =
                formatDate(
                    order.createdAt ||
                    order.date
                );


            /* ==============================
               CARD
               ============================== */

            ordersHTML += `

                <div
                    class="order-card"
                    data-order-id="${orderId}"
                >


                    <div
                        class="order-header"
                    >


                        <div>


                            <div
                                class="order-id"
                            >
                                ${orderId}
                            </div>


                            <div
                                class="order-date"
                            >
                                ${date}
                            </div>


                        </div>


                        <div
                            class="
                                status
                                ${getStatusClass(
                                    status
                                )}
                            "
                        >
                            ${status}
                        </div>


                    </div>


                    <div
                        class="order-info"
                    >


                        <div
                            class="info-item"
                        >

                            <span
                                class="info-label"
                            >
                                Items
                            </span>


                            <span
                                class="info-value"
                            >
                                ${items.length}
                            </span>

                        </div>


                        <div
                            class="info-item"
                        >

                            <span
                                class="info-label"
                            >
                                Payment
                            </span>


                            <span
                                class="info-value"
                            >
                                ${payment}
                            </span>

                        </div>


                    </div>


                    <div
                        class="item-preview"
                    >

                        ${previewHTML}

                    </div>


                    <div
                        class="order-footer"
                    >


                        <div>

                            <div
                                class="total-label"
                            >
                                Total Amount
                            </div>


                            <div
                                class="total-price"
                            >
                                ${total}
                            </div>

                        </div>


                        <button
                            class="view-btn"
                            type="button"
                            data-order-id="${orderId}"
                        >
                            View Order
                        </button>


                    </div>


                </div>

            `;

        }
    );


    ordersContainer.innerHTML =
        ordersHTML;


    /* ======================================
       VIEW ORDER BUTTONS
       ====================================== */

    const viewButtons =
        ordersContainer.querySelectorAll(
            ".view-btn"
        );


    viewButtons.forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    const orderId =
                        this.getAttribute(
                            "data-order-id"
                        );


                    if (
                        !orderId
                    ) {

                        return;

                    }


                    window.location.href =
                        "order-details.html?id=" +
                        encodeURIComponent(
                            orderId
                        );

                }
            );

        }
    );

}


/* ==========================================
   LOGOUT
   ========================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "varnamCustomerToken"
            );

            localStorage.removeItem(
                "varnamCustomer"
            );

            window.location.href =
                "login.html";

        }
    );

/* ==========================================
   BACK BUTTON
   ========================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            /* Use browser history first */

            if (
                window.history.length > 1
            ) {

                window.history.back();

                return;

            }


            /* Fallback */

            window.location.href =
                "index.html";

        }
    );
  /* ==========================================
   START
   ========================================== */

loadOrders();


</script>


</body>

</html>
