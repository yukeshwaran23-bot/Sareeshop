<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout | Varnam Silks</title>

<link rel="stylesheet" href="style.css">

<style>

.checkout-page {
    max-width:1100px;
    margin:auto;
    padding:25px 16px 70px;
}

.checkout-title {
    text-align:center;
    margin-bottom:30px;
}

.checkout-title p {
    color:var(--gold);
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.checkout-title h1 {
    color:var(--maroon);
    font-size:30px;
    font-weight:500;
}

.checkout-layout {
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}

.checkout-card {
    background:var(--white);
    border:1px solid var(--border);
    border-radius:7px;
    padding:20px;
}

.checkout-card h2 {
    color:var(--maroon);
    font-size:21px;
    font-weight:500;
    margin-bottom:20px;
}

.form-group {
    margin-bottom:16px;
}

.form-group label {
    display:block;
    color:var(--text);
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:600;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid var(--border);
    border-radius:4px;
    background:var(--cream);
    color:var(--text);
    font-family:Arial,sans-serif;
    font-size:13px;
    outline:none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color:var(--gold);
}

.form-group textarea {
    min-height:90px;
    resize:vertical;
}

.required {
    color:var(--maroon);
}

.form-row {
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.checkout-items {
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:20px;
}

.checkout-item {
    display:flex;
    gap:10px;
    align-items:center;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}

.checkout-item img {
    width:60px;
    height:75px;
    object-fit:cover;
    border-radius:4px;
    flex-shrink:0;
}

.checkout-item-info {
    flex:1;
    min-width:0;
}

.checkout-item-name {
    color:var(--text);
    font-size:12px;
    line-height:1.4;
    margin-bottom:4px;
}

.checkout-item-qty {
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:10px;
}

.checkout-item-price {
    color:var(--maroon);
    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
}

.checkout-summary-row {
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-family:Arial,sans-serif;
    font-size:12px;
}

.checkout-summary-row span:first-child {
    color:var(--muted);
}

.checkout-summary-row span:last-child {
    color:var(--text);
    font-weight:600;
}

.checkout-final-total {
    display:flex;
    justify-content:space-between;
    padding-top:17px;
    color:var(--maroon);
    font-family:Arial,sans-serif;
    font-size:18px;
    font-weight:700;
}

.payment-box {
    margin-top:20px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--cream);
}

.payment-box h3 {
    color:var(--maroon);
    font-size:14px;
    margin-bottom:10px;
}

.payment-option {
    display:flex;
    align-items:center;
    gap:9px;
    font-family:Arial,sans-serif;
    font-size:12px;
}

.payment-option input {
    accent-color:var(--maroon);
}

.place-order-btn {
    width:100%;
    height:50px;
    margin-top:20px;
    border:none;
    border-radius:4px;
    background:var(--maroon);
    color:var(--white);
    font-size:13px;
    letter-spacing:.5px;
}

.place-order-btn:disabled {
    opacity:.5;
}

.back-cart {
    display:inline-block;
    margin-bottom:22px;
    border:none;
    background:transparent;
    color:var(--maroon);
    font-size:13px;
}

@media (min-width:700px) {

    .checkout-page {
        padding:45px 25px 90px;
    }

    .checkout-title h1 {
        font-size:38px;
    }

    .checkout-layout {
        grid-template-columns:
            minmax(0,1.2fr)
            minmax(320px,.8fr);
        align-items:start;
    }

    .form-row {
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <button
        class="icon-btn"
        id="backButton"
    >
        ←
    </button>

    <div class="brand">

        <div class="brand-name">
            VARNAM SILKS
        </div>

        <div class="brand-tagline">
            SAREES THAT SPEAK ELEGANCE
        </div>

    </div>

    <div style="width:40px;"></div>

</header>


<main class="checkout-page">


<button
    class="back-cart"
    id="backCartButton"
>
    ← Back to Cart
</button>


<div class="checkout-title">

    <p>COMPLETE YOUR ORDER</p>

    <h1>Checkout</h1>

</div>


<div class="checkout-layout">


<section class="checkout-card">

<h2>Delivery Details</h2>


<div class="form-group">

<label>
    Full Name
    <span class="required">*</span>
</label>

<input
    type="text"
    id="customerName"
    placeholder="Enter your full name"
    autocomplete="name"
>

</div>


<div class="form-group">

<label>
    Mobile Number
    <span class="required">*</span>
</label>

<input
    type="tel"
    id="customerPhone"
    placeholder="Enter your mobile number"
    maxlength="10"
    autocomplete="tel"
>

</div>


<div class="form-group">

<label>
    Address
    <span class="required">*</span>
</label>

<textarea
    id="customerAddress"
    placeholder="House / Door No, Street, Area"
    autocomplete="street-address"
></textarea>

</div>


<div class="form-row">

<div class="form-group">

<label>
    City
    <span class="required">*</span>
</label>

<input
    type="text"
    id="customerCity"
    placeholder="City"
    autocomplete="address-level2"
>

</div>


<div class="form-group">

<label>
    Pincode
    <span class="required">*</span>
</label>

<input
    type="text"
    id="customerPincode"
    placeholder="Pincode"
    maxlength="6"
    inputmode="numeric"
    autocomplete="postal-code"
>

</div>

</div>


<div class="form-group">

<label>State</label>

<input
    type="text"
    id="customerState"
    value="Tamil Nadu"
    autocomplete="address-level1"
>

</div>


<div class="payment-box">

<h3>Payment Method</h3>


<label class="payment-option">

<input
    type="radio"
    name="payment"
    value="cod"
    checked
>

Cash on Delivery

</label>


<label
    class="payment-option"
    style="margin-top:12px;"
>

<input
    type="radio"
    name="payment"
    value="upi"
>

UPI

</label>


<div
    id="upiPaymentBox"
    style="
        display:none;
        margin-top:15px;
        padding:15px;
        border:1px solid var(--border);
        border-radius:5px;
        background:#fff;
    "
>

<h3>UPI Payment</h3>

<p
    style="
        font-size:12px;
        color:var(--muted);
        line-height:1.5;
    "
>
    UPI payment will be available here.
</p>

</div>

</div>


<button
    type="button"
    class="place-order-btn"
    id="placeOrderButton"
>
    Place Order
</button>


</section>


<section class="checkout-card">

<h2>Your Order</h2>


<div
    class="checkout-items"
    id="checkoutItems"
>
</div>


<div class="checkout-summary-row">

<span>Items</span>

<span id="checkoutItemCount">
0
</span>

</div>


<div class="checkout-summary-row">

<span>Subtotal</span>

<span id="checkoutSubtotal">
₹0
</span>

</div>


<div class="checkout-summary-row">

<span>Delivery</span>

<span id="checkoutDelivery">
FREE
</span>

</div>


<div class="checkout-final-total">

<span>Total</span>

<span id="checkoutTotal">
₹0
</span>

</div>


</section>


</div>


</main>


<script>


const API_URL =
    "https://varnam-silks-backend-4.onrender.com";


const CUSTOMER_TOKEN_KEY =
    "varnamCustomerToken";


const checkoutItems =
    document.getElementById(
        "checkoutItems"
    );


const checkoutItemCount =
    document.getElementById(
        "checkoutItemCount"
    );


const checkoutSubtotal =
    document.getElementById(
        "checkoutSubtotal"
    );


const checkoutDelivery =
    document.getElementById(
        "checkoutDelivery"
    );


const checkoutTotal =
    document.getElementById(
        "checkoutTotal"
    );


const placeOrderButton =
    document.getElementById(
        "placeOrderButton"
    );


let checkoutCart = [];


function getCustomerToken() {

    return localStorage.getItem(
        CUSTOMER_TOKEN_KEY
    );

}


/* ==========================================
   LOAD CUSTOMER CART
   ========================================== */

async function getCheckoutCart() {

    const token =
        getCustomerToken();


    /* GUEST */

    if (!token) {

        try {

            const savedCart =
                localStorage.getItem(
                    "varnamCart"
                );

            if (!savedCart) {
                return [];
            }

            const cart =
                JSON.parse(savedCart);

            return Array.isArray(cart)
                ? cart
                : [];

        } catch (error) {

            console.error(
                "Guest cart error:",
                error
            );

            return [];

        }

    }


    /* LOGGED-IN CUSTOMER */

    try {

        const cartResponse =
            await fetch(
                API_URL +
                "/api/customer/cart",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!cartResponse.ok) {

            throw new Error(
                "Customer cart request failed"
            );

        }


        const cartData =
            await cartResponse.json();


        const accountCart =
            Array.isArray(
                cartData.cart
            )
                ? cartData.cart
                : [];


        if (
            accountCart.length === 0
        ) {

            return [];

        }


        const productsResponse =
            await fetch(
                API_URL +
                "/api/products"
            );


        if (!productsResponse.ok) {

            throw new Error(
                "Products request failed"
            );

        }


        const products =
            await productsResponse.json();


        return accountCart
            .map(function(item) {

                const product =
                    products.find(
                        function(p) {

                            return String(p.id) ===
                                String(item.productId);

                        }
                    );


                if (!product) {

                    return null;

                }


                return {

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price
                        ) || 0,

                    image:
                        product.image || "",

                    category:
                        product.type || "Sarees",

                    quantity:
                        Number(
                            item.quantity
                        ) || 1

                };

            })
            .filter(Boolean);


    } catch (error) {

        console.error(
            "Customer cart loading failed:",
            error
        );

        return [];

    }

}


/* ==========================================
   PRICE FORMAT
   ========================================== */

function checkoutPrice(price) {

    return "₹" +
        Number(price || 0)
            .toLocaleString("en-IN");

}


/* ==========================================
   LOAD CHECKOUT
   ========================================== */

async function loadCheckout() {

    checkoutItems.innerHTML = `
        <div
            style="
                text-align:center;
                padding:25px 10px;
                color:#777;
                font-family:Arial,sans-serif;
                font-size:12px;
            "
        >
            Loading your cart...
        </div>
    `;


    placeOrderButton.disabled =
        true;


    const cart =
        await getCheckoutCart();


    checkoutCart =
        cart;


    checkoutItems.innerHTML =
        "";


    if (
        cart.length === 0
    ) {

        checkoutItems.innerHTML = `
            <div
                style="
                    text-align:center;
                    padding:25px 10px;
                    color:#777;
                    font-family:Arial,sans-serif;
                    font-size:12px;
                "
            >

                Your cart is empty.

                <br><br>

                <a
                    href="index.html"
                    style="color:#6b1d27;"
                >
                    Continue Shopping
                </a>

            </div>
        `;


        placeOrderButton.disabled =
            true;


        checkoutItemCount.textContent =
            "0";


        checkoutSubtotal.textContent =
            "₹0";


        checkoutDelivery.textContent =
            "FREE";


        checkoutTotal.textContent =
            "₹0";


        return;

    }


    placeOrderButton.disabled =
        false;


    let subtotal = 0;

    let totalItems = 0;


    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(item.price) || 0;


        const itemTotal =
            price * quantity;


        subtotal +=
            itemTotal;


        totalItems +=
            quantity;


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "checkout-item";


        element.innerHTML = `

            <img
                src="${item.image || ""}"
                alt="${item.name || "Product"}"
            >

            <div class="checkout-item-info">

                <div class="checkout-item-name">
                    ${item.name || "Product"}
                </div>

                <div class="checkout-item-qty">
                    Quantity: ${quantity}
                </div>

            </div>

            <div class="checkout-item-price">
                ${checkoutPrice(itemTotal)}
            </div>

        `;


        checkoutItems.appendChild(
            element
        );

    });


    let delivery = 0;


    if (
        subtotal > 0 &&
        subtotal < 1000
    ) {

        delivery = 80;

    }


    const total =
        subtotal + delivery;


    checkoutItemCount.textContent =
        totalItems;


    checkoutSubtotal.textContent =
        checkoutPrice(
            subtotal
        );


    checkoutDelivery.textContent =
        delivery === 0
            ? "FREE"
            : checkoutPrice(
                delivery
            );


    checkoutTotal.textContent =
        checkoutPrice(
            total
        );

}
  /* ==========================================
   LOAD SAVED CUSTOMER DETAILS
   ========================================== */

function loadSavedCustomerDetails() {

    try {

        const saved =
            localStorage.getItem(
                "varnamCustomer"
            );


        if (!saved) {

            return;

        }


        const customer =
            JSON.parse(saved);


        if (!customer) {

            return;

        }


        document.getElementById(
            "customerName"
        ).value =
            customer.name || "";


        document.getElementById(
            "customerPhone"
        ).value =
            customer.phone || "";


        document.getElementById(
            "customerAddress"
        ).value =
            customer.address || "";


        document.getElementById(
            "customerCity"
        ).value =
            customer.city || "";


        document.getElementById(
            "customerPincode"
        ).value =
            customer.pincode || "";


        document.getElementById(
            "customerState"
        ).value =
            customer.state ||
            "Tamil Nadu";


    } catch (error) {

        console.log(
            "Customer details loading failed"
        );

    }

}


/* ==========================================
   VALIDATE CHECKOUT
   ========================================== */

function validateCheckout() {

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const address =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const city =
        document.getElementById(
            "customerCity"
        ).value.trim();


    const pincode =
        document.getElementById(
            "customerPincode"
        ).value.trim();


    if (!name) {

        alert(
            "Please enter your full name."
        );

        return false;

    }


    if (
        !/^[0-9]{10}$/.test(phone)
    ) {

        alert(
            "Please enter a valid 10-digit mobile number."
        );

        return false;

    }


    if (!address) {

        alert(
            "Please enter your delivery address."
        );

        return false;

    }


    if (!city) {

        alert(
            "Please enter your city."
        );

        return false;

    }


    if (
        !/^[0-9]{6}$/.test(pincode)
    ) {

        alert(
            "Please enter a valid 6-digit pincode."
        );

        return false;

    }


    return true;

}


/* ==========================================
   PLACE ORDER
   ========================================== */

placeOrderButton.addEventListener(
    "click",
    async function() {


        const cart =
            checkoutCart.length > 0
                ? checkoutCart
                : await getCheckoutCart();


        if (
            cart.length === 0
        ) {

            alert(
                "Your cart is empty."
            );

            return;

        }


        if (
            !validateCheckout()
        ) {

            return;

        }


        const name =
            document.getElementById(
                "customerName"
            ).value.trim();


        const phone =
            document.getElementById(
                "customerPhone"
            ).value.trim();


        const address =
            document.getElementById(
                "customerAddress"
            ).value.trim();


        const city =
            document.getElementById(
                "customerCity"
            ).value.trim();


        const pincode =
            document.getElementById(
                "customerPincode"
            ).value.trim();


        const state =
            document.getElementById(
                "customerState"
            ).value.trim();


        /* CALCULATE TOTAL */

        let subtotal = 0;


        cart.forEach(
            function(item) {

                subtotal +=
                    (
                        Number(
                            item.price
                        ) || 0
                    ) *
                    (
                        Number(
                            item.quantity
                        ) || 1
                    );

            }
        );


        let delivery = 0;


        if (
            subtotal > 0 &&
            subtotal < 1000
        ) {

            delivery = 80;

        }


        const total =
            subtotal + delivery;


        /* PAYMENT */

        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        const paymentMethod =
            selectedPayment &&
            selectedPayment.value === "upi"
                ? "UPI"
                : "Cash on Delivery";


        /* CREATE ORDER */

        const order = {

            orderId:
                "VS" +
                Date.now(),


            customer: {

                name:
                    name,

                phone:
                    phone,

                address:
                    address,

                city:
                    city,

                pincode:
                    pincode,

                state:
                    state

            },


            items:
                cart.map(
                    function(item) {

                        return {

                            productId:
                                Number(
                                    item.id
                                ),

                            name:
                                item.name,

                            price:
                                Number(
                                    item.price
                                ) || 0,

                            quantity:
                                Number(
                                    item.quantity
                                ) || 1,

                            image:
                                item.image || ""

                        };

                    }
                ),


            subtotal:
                subtotal,


            delivery:
                delivery,


            total:
                total,


            paymentMethod:
                paymentMethod,


            status:
                "Order Placed",


            createdAt:
                new Date().toISOString()

        };


        /* DISABLE BUTTON */

        placeOrderButton.disabled =
            true;


        placeOrderButton.textContent =
            "Placing Order...";


        /* ==========================================
           SAVE TO MONGODB
           ========================================== */

        try {

            const token =
                getCustomerToken();


            const headers = {

                "Content-Type":
                    "application/json"

            };


            if (token) {

                headers.Authorization =
                    "Bearer " + token;

            }


            const response =
                await fetch(
                    API_URL +
                    "/api/orders",
                    {

                        method:
                            "POST",

                        headers:
                            headers,

                        body:
                            JSON.stringify(
                                order
                            )

                    }
                );


            if (
                !response.ok
            ) {

                const errorData =
                    await response
                        .json()
                        .catch(
                            function() {
                                return {};
                            }
                        );


                throw new Error(
                    errorData.message ||
                    "Failed to save order"
                );

            }


            const result =
                await response.json();


            console.log(
                "Order saved:",
                result
            );


        } catch (error) {

            console.error(
                "Order save failed:",
                error
            );


            alert(
                "Order could not be saved. Please try again."
            );


            placeOrderButton.disabled =
                false;


            placeOrderButton.textContent =
                "Place Order";


            return;

        }


        /* ==========================================
           SAVE LAST ORDER
           ========================================== */

        localStorage.setItem(
            "varnamLastOrder",
            JSON.stringify(
                order
            )
        );


        /* ==========================================
           SAVE CUSTOMER DETAILS
           ========================================== */

        const customerDetails = {

            name:
                name,

            phone:
                phone,

            address:
                address,

            city:
                city,

            pincode:
                pincode,

            state:
                state

        };


        localStorage.setItem(
            "varnamCustomer",
            JSON.stringify(
                customerDetails
            )
        );


        /* ==========================================
           CLEAR CUSTOMER CART
           ========================================== */

        if (token) {

            try {

                await fetch(
                    API_URL +
                    "/api/customer/cart",
                    {

                        method:
                            "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer " +
                                token

                        }

                    }
                );


            } catch (error) {

                console.error(
                    "Cart clear failed:",
                    error
                );

            }

        } else {

            localStorage.removeItem(
                "varnamCart"
            );

        }


        /* ==========================================
           SUCCESS
           ========================================== */

        alert(
            "Order placed successfully!\n\n" +
            "Order ID: " +
            order.orderId
        );


        window.location.href =
            "order-success.html";


    }
);


/* ==========================================
   BACK TO CART
   ========================================== */

document
    .getElementById(
        "backCartButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "cart.html";

            }

        }
    );


/* ==========================================
   TOP BACK BUTTON
   ========================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "cart.html";

            }

        }
    );


/* ==========================================
   UPI DISPLAY
   ========================================== */

const paymentOptions =
    document.querySelectorAll(
        'input[name="payment"]'
    );


const upiPaymentBox =
    document.getElementById(
        "upiPaymentBox"
    );


paymentOptions.forEach(
    function(option) {
